name: Scheduled dependency security

on:
  schedule:
    - cron: '23 7 * * 1' # Monday, 07:23 UTC
    - cron: '43 7 1 * *' # First day of the month, 07:43 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: Audit policy
        type: choice
        options: [weekly, monthly]
        default: monthly

permissions:
  contents: read

concurrency:
  group: dependency-security-updates
  cancel-in-progress: false

jobs:
  repair:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-aube
      - name: Choose policy
        id: policy
        env:
          SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          mode=weekly
          if [[ "$SCHEDULE" == '43 7 1 * *' || "$REQUESTED_MODE" == monthly ]]; then
            mode=monthly
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Preserve updates from the existing security PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh pr list --head automation/dependency-security --state open --json number --jq length)
          if [[ "$count" -gt 0 ]]; then
            gh auth setup-git
            git fetch origin automation/dependency-security
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git merge --squash --no-commit FETCH_HEAD
          fi
      - name: Test security automation
        run: node --test scripts/dependency-security.test.mjs
      - name: Audit, repair, and validate
        id: security
        env:
          AUDIT_MODE: ${{ steps.policy.outputs.mode }}
        run: node scripts/dependency-security.mjs "$AUDIT_MODE" --fix
      - name: Create or update the security PR
        if: steps.security.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ github.token }}
          branch: automation/dependency-security
          title: 'fix: update vulnerable dependencies'
          commit-message: 'fix: update vulnerable dependencies'
          body-path: .security-report/pr.md
          draft: ${{ steps.security.outputs.draft }}
          add-paths: |
            package.json
            aube-lock.yaml
      - name: Publish findings that need attention
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_MODE: ${{ steps.policy.outputs.mode }}
          NEEDS_REPORT: ${{ steps.security.outputs.report_issue }}
        run: |
          title="Dependency security report ($AUDIT_MODE)"
          number=$(gh issue list --state open --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [[ "$NEEDS_REPORT" == true ]]; then
            if [[ -n "$number" ]]; then
              gh issue edit "$number" --body-file .security-report/report.md
            else
              gh issue create --title "$title" --body-file .security-report/report.md
            fi
          elif [[ -n "$number" ]]; then
            gh issue close "$number"
          fi
      - name: Save reports and validation logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-security-${{ github.run_id }}
          path: .security-report/
          retention-days: 90
          if-no-files-found: ignore
      - name: Mark unresolved findings or failed validation
        if: steps.security.outputs.failed == 'true'
        run: |
          echo '::error::Review the security PR/report: vulnerabilities remain or validation failed.'
          exit 1
