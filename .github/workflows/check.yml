name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-aube
      - name: Install dependencies
        run: aube install --frozen-lockfile
      - name: Fail on high or critical dependency advisories
        run: aube audit --audit-level high
      - name: Lint, typecheck, test, and validate content
        run: aubr check
      - name: Build and prerender both Locale pages
        run: aubr build
      - name: Check the prerendered Locale pages
        run: aubr test:prerender
      - name: Install Chromium for Playwright
        run: aubr playwright install --with-deps --only-shell chromium
      - name: Drive the built site in Chromium
        run: aubr test:e2e
      - name: Keep Playwright traces of failed tests
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
